<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- color-scheme dark: hace que los scrollbars y controles nativos del
         navegador se pinten oscuros, en vez de quedar blancos y desentonar. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d0c" />

    <!-- Tipografías: Bricolage Grotesque (display, para la identidad) e
         Instrument Sans (cuerpo). preconnect acelera la descarga. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>YVR Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
